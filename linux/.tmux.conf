# Fix SSH startup escape-sequence delay & history
set -sg escape-time 10
set -g history-limit 50000
set -g mouse on

# Smooth 1-line-per-tick trackpad/touch scrolling (instead of default 5)
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
set -g focus-events on
setw -g aggressive-resize on

# 1-indexed windows/panes, auto-renumbering & keep manual window names locked
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g allow-rename off

# Splits & new windows in current directory, pair-flip, last-window & reload
bind '"' split-window -v -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
bind a   if-shell -F "#{e|==|:#{e|%|:#I,2},1}" "select-window -t :+1" "select-window -t :-1"
bind Tab last-window
bind r   source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# True color support (using xterm-256color so hermes2 terminfo always works)
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Transparent top status bar (inherits your terminal background)
set -g status-position top
set -g status-interval 15
set -g status-style bg=default,fg=colour245
set -g status-left-length 30
set -g status-right-length 50

# Left: session name (turns amber on Prefix, green in Copy mode)
set -g status-left "#{?client_prefix,#[fg=colour214#,bold],#{?pane_in_mode,#[fg=colour114#,bold],#[fg=colour39#,bold]}} ▸ #S #[fg=colour238,nobold]│ "

# Windows: clean paired tabs (`1:bench 2 · 3:cpc 4 · 5:hermes 6 · 7:~ 8`), zero shift
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour241]#I#{?#{==:#W,},,:#[fg=colour245]#W}#{?window_zoomed_flag,#[fg=colour214]+,}#{?window_end_flag,,#{?#{&&:#{e|==|:#{e|%|:#I,2},0},#{e|<=|:#I,8}}, #[fg=colour238#,nobold]· ,#{?#{e|<=|:#I,8}, ,  }}}"
setw -g window-status-current-format "#[fg=colour39,bold]#I#{?#{==:#W,},,:#[fg=colour255#,bold]#W}#{?window_zoomed_flag,#[fg=colour214] [Z],}#{?window_end_flag,,#{?#{&&:#{e|==|:#{e|%|:#I,2},0},#{e|<=|:#I,8}},#[nobold] #[fg=colour238]· ,#{?#{e|<=|:#I,8},#[nobold] ,#[nobold]  }}}"

# Right: active mode badge + host + time (no default quotes/date clutter)
set -g status-right "#{?client_prefix,#[fg=colour214#,bold]PREFIX #[fg=colour238#,nobold]│ ,}#{?pane_in_mode,#[fg=colour114#,bold]COPY #[fg=colour238#,nobold]│ ,}#[fg=colour242]#h #[fg=colour238]│ #[fg=colour250]%H:%M "

# Prompts & mouse-selection highlight (replaces default bright yellow)
set -g message-style bg=default,fg=colour39,bold
set -g message-command-style bg=default,fg=colour214,bold
setw -g mode-style bg=colour24,fg=colour255

# Clean split-pane borders (subtle grey inactive, cyan active)
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Allow OSC 52 clipboard passthrough (makes clip() and mouse selection copy to Windows clipboard)
set -g allow-passthrough on
set -s set-clipboard on

# Synchronized-output passthrough so tmux forwards the atomic frame lock straight to the terminal and the tables updates with zero flicker
set -as terminal-features ",*:sync"
